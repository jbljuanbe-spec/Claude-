<!DOCTYPE html>
<html lang="es">
<head>

  <title>Hazte con Todos · Simulador de carrera Pokémon</title>

  <meta name="theme-color" content="#eaeef7">
  <link rel="canonical" href="https://hazte-con-todos.pages.dev/">

  <!-- Datos estructurados: ayuda a Google a entender qué es esto sin tocar
       nada visible para el jugador. -->

  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Hazte con Todos",
    "url": "https://hazte-con-todos.pages.dev/",
    "image": "https://hazte-con-todos.pages.dev/portada.png",
    "description": "Simulador de carrera de entrenador Pokémon: veinte años de decisiones, torneos y rivalidades en dos minutos, con una tarjeta final para compartir.",
    "genre": ["Simulation", "Life Simulation"],
    "applicationCategory": "Game",
    "gamePlatform": "Web Browser",
    "inLanguage": "es",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "author": { "@type": "Person", "name": "SoyPalo_", "url": "https://x.com/soypalo_" }

  <!-- Tarjeta de previsualización al compartir el enlace (WhatsApp, X, Telegram...) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hazte-con-todos.pages.dev/">
  <meta property="og:title" content="Hazte con Todos · Simulador de carrera Pokémon">
  <meta property="og:description" content="Veinte años de carrera como entrenador Pokémon en dos minutos. Decisiones con su porcentaje, torneos, lesiones y una tarjeta final para compartir.">

  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hazte con Todos">
  <meta name="twitter:description" content="Simula 20 años de carrera como entrenador Pokémon. ¿Hasta dónde llegas?">
  <meta name="twitter:image" content="https://hazte-con-todos.pages.dev/portada.png">
  <link rel="preload" href="fuentes/SpaceGrotesk.woff2?v=40" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/PixelifySans.woff2?v=40" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilo.css?v=40">
  <script>
    // Antes de pintar nada: si hay tema elegido a mano, se aplica ya. Si no,
    // manda el del sistema (lo resuelve el CSS). Así no hay fogonazo blanco.
    try {
      var t = localStorage.getItem('hazteconTodos.tema');
      if (t) document.documentElement.dataset.tema = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Contenido inicial para buscadores/rastreadores: el juego lo sustituye
         al cargar (mismo texto, así que no hay parpadeo para el jugador). -->
    <div class="portada">
      <div class="bolas">⚡ 🔴 ⚡</div>
      <h1>Hazte<br>con Todos</h1>
      <p class="sub">Veinte años de carrera como entrenador Pokémon.<br>Solo tomas las decisiones que importan.</p>
      <p class="premisa">
        Un mundo donde la Liga es un deporte profesional de verdad: empiezas con diez años
        cazando bichos por las rutas y acabas en regionales con jueces, patrocinadores y
        control de legalidad.
      </p>
    </div>
    <noscript>
      <p style="text-align:center;padding:0 16px">
        Hazte con Todos es un simulador de carrera de entrenador Pokémon: elige nombre,
        región e inicial, y vive veinte años de decisiones, torneos y rivalidades hasta
        tu retiro. Necesita JavaScript activado para jugar.
      </p>
    </noscript>
  </div>
  <script type="module" src="js/juego.js?v=40"></script>
</body>
</html>
