<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Encuentra el Trozo con Cebolla</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>🍳</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #ffe9c7 0%, #f6c98a 55%, #e0a35f 100%);
    color: #5a3a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: clamp(14px, 4.5vw, 20px);
    padding: 4px 6px;
  }
  header .rec { color: #a85a1a; }
  h1 {
    font-size: clamp(18px, 5.5vw, 30px);
    text-align: center;
    margin: 4px 0 2px;
    color: #7a3d0e;
    text-shadow: 1px 1px 0 #fff4;
    letter-spacing: .5px;
  }
  .sub {
    font-size: clamp(10px, 3vw, 13px);
    text-align: center;
    color: #8a5a2a;
    margin-bottom: 6px;
    font-style: italic;
  }
  #stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #board {
    position: relative;
    background: #c98a4a;
    border-radius: 18px;
    box-shadow: 0 10px 26px #0004, inset 0 0 0 6px #b3763a, inset 0 0 0 10px #d99a55;
    padding: 12px;
    transition: opacity .28s ease;
    touch-action: manipulation;
    line-height: 0;
  }
  #board canvas { display: block; border-radius: 8px; }
  #footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 6px 2px;
    font-weight: 600;
    font-size: clamp(13px, 4vw, 18px);
  }
  #fails { color: #b23a2a; }
  button {
    font-family: inherit;
    font-weight: 700;
    border: none;
    cursor: pointer;
    background: #d4702a;
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 3.5vw, 15px);
    box-shadow: 0 3px 0 #a8501a;
    transition: transform .08s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8501a; }

  #flash {
    position: absolute; inset: 0;
    background: #ff2a2a; opacity: 0; pointer-events: none; border-radius: 18px;
  }
  #flash.on { animation: flashRed .22s ease; }
  @keyframes flashRed { 0%{opacity:.55} 100%{opacity:0} }
  #app.shake { animation: shake .22s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)}
    50%{transform:translateX(6px)} 75%{transform:translateX(-4px)}
  }
  #msg {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(.4);
    font-size: clamp(28px, 11vw, 64px); font-weight: 900; color: #1c9c3c;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #0002; opacity: 0; pointer-events: none; white-space: nowrap;
  }
  #msg.win { animation: pop 1s ease forwards; }
  @keyframes pop {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4)}
    20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}
    75%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.05)}
  }
  #ole {
    position: absolute; left: 50%; top: 20%; transform: translateX(-50%);
    font-size: clamp(22px, 8vw, 44px); font-weight: 900; color: #d4702a;
    text-shadow: 2px 2px 0 #fff; opacity: 0; pointer-events: none;
  }
  #ole.win { animation: ole 1s ease forwards; }
  @keyframes ole {
    0%{opacity:0; transform:translateX(-50%) translateY(10px)}
    30%{opacity:1; transform:translateX(-50%) translateY(0)}
    100%{opacity:0; transform:translateX(-50%) translateY(-20px)}
  }
  #miss {
    position: absolute; left: 50%; top: 40%; transform: translateX(-50%);
    font-size: clamp(20px, 7vw, 40px); font-weight: 900; color: #fff;
    text-shadow: 2px 2px 0 #b02020; opacity: 0; pointer-events: none; white-space: nowrap; text-align: center;
  }
  #miss.on { animation: missA .8s ease forwards; }
  @keyframes missA {
    0%{opacity:0; transform:translateX(-50%) scale(.6)}
    25%{opacity:1; transform:translateX(-50%) scale(1.1)} 80%{opacity:1} 100%{opacity:0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="level">Nivel 1</span>
    <span class="rec" id="record">Récord: 1</span>
  </header>
  <h1>¿Dónde está la cebolla?</h1>
  <div class="sub">La Guerra de la Tortilla · encuentra el único trozo traidor</div>
  <div id="stage">
    <div id="board"></div>
    <div id="flash"></div>
    <div id="miss"></div>
    <div id="ole">¡Olé!</div>
    <div id="msg">¡ENCONTRADA!</div>
  </div>
  <div id="footer">
    <span id="fails">Fallos: 0</span>
    <button id="reset">Empezar de nuevo</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  if (!window.THREE) { document.getElementById("board").textContent = "No se pudo cargar 3D"; return; }
  var THREE = window.THREE;

  // ---- DOM / estado ----
  var board = document.getElementById("board");
  var app = document.getElementById("app");
  var elLevel = document.getElementById("level");
  var elRecord = document.getElementById("record");
  var elFails = document.getElementById("fails");
  var flash = document.getElementById("flash");
  var msg = document.getElementById("msg");
  var ole = document.getElementById("ole");
  var miss = document.getElementById("miss");

  var REC_KEY = "tortillaRecord";
  var record = parseInt(localStorage.getItem(REC_KEY) || "1", 10) || 1;

  var level = 1, fails = 0, cols = 4, rows = 4, targetIndex = 0, locked = false;

  var msgFrases = ["¡ENCONTRADA!", "¡ESA ES!", "¡CEBOLLISTA!", "¡BIEN VISTO!"];
  var missFrases = ["¡AY! Esa es sin cebolla", "¡Esa no lleva!", "Prueba otra vez",
                    "¡Nada de cebolla ahí!", "Team sincebollista detectado"];

  function gridForLevel(l) {
    var map = { 1: 4, 2: 6, 3: 8, 4: 10 };
    if (map[l]) return map[l];
    return Math.min(30, 12 + (l - 5) * 2);
  }

  // ---- Three: escena, cámara, luces ----
  var scene = new THREE.Scene();
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  board.appendChild(renderer.domElement);

  // cámara ortográfica cenital ligeramente inclinada (volumen sin deformar la rejilla)
  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);

  var amb = new THREE.AmbientLight(0xfff1d8, 0.7);
  scene.add(amb);
  var key = new THREE.DirectionalLight(0xfff4d6, 0.85);
  key.position.set(-4, 9, 4);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xffd9a0, 0.25);
  fill.position.set(5, 4, -3);
  scene.add(fill);

  // ---- Geometría de un trozo: disco de tortilla girado + ruido rústico ----
  function makePieceGeometry() {
    var pts = [
      new THREE.Vector2(0.00, 0.00),
      new THREE.Vector2(0.60, 0.00),
      new THREE.Vector2(0.92, 0.03),
      new THREE.Vector2(1.00, 0.12),
      new THREE.Vector2(0.97, 0.22),
      new THREE.Vector2(0.80, 0.30),
      new THREE.Vector2(0.48, 0.35),
      new THREE.Vector2(0.00, 0.37)
    ];
    var g = new THREE.LatheGeometry(pts, 44);
    // ruido en los vértices: superficie irregular, nada industrial
    var pos = g.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
      pos.setX(i, vx + (Math.random() - 0.5) * 0.03);
      pos.setZ(i, vz + (Math.random() - 0.5) * 0.03);
      if (vy > 0.04) pos.setY(i, vy + (Math.random() - 0.5) * 0.03);
    }
    g.computeVertexNormals();
    return g;
  }
  var pieceGeo = makePieceGeometry();

  // ---- Texturas procedurales (huevo+patata / cara tostada) ----
  function makeTexture(flipped) {
    var s = 512, cv = document.createElement("canvas");
    cv.width = cv.height = s;
    var c = cv.getContext("2d");
    function rnd() { return Math.random(); }
    // base huevo cuajado
    c.fillStyle = flipped ? "#d99a3e" : "#eab63e";
    c.fillRect(0, 0, s, s);
    // manchas doradas / tostadas / relieve de patata (idea del usuario)
    var n = flipped ? 320 : 420;
    for (var i = 0; i < n; i++) {
      var x = rnd() * s, y = rnd() * s, r = s * (0.012 + rnd() * 0.05), q = rnd();
      if (!flipped && q > 0.62) c.fillStyle = "#f7e6a0";      // patata asomando
      else if (q > 0.6) c.fillStyle = "#bd7a22";              // bien tostado
      else if (q > 0.3) c.fillStyle = flipped ? "#c78a30" : "#da9d30"; // medio
      else c.fillStyle = flipped ? "#b57828" : "#f0c34e";     // claro
      c.globalAlpha = 0.5 + rnd() * 0.5;
      c.beginPath(); c.arc(x, y, r, 0, 6.28); c.fill();
    }
    c.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }
  var texNormal = makeTexture(false);
  var texFlip = makeTexture(true);

  var matPieces = new THREE.MeshStandardMaterial({
    map: texNormal, bumpMap: texNormal, bumpScale: 0.05, roughness: 0.9, metalness: 0.0
  });

  // ---- Cebolla (tira curva) / marca de tostado ----
  var geoOnion = new THREE.TorusGeometry(1, 0.28, 10, 28, Math.PI * 1.25); // arco: tira curva
  var geoToast = new THREE.SphereGeometry(1, 20, 16);
  var matOnion = new THREE.MeshStandardMaterial({ color: 0x7a3d0d, roughness: 0.6, metalness: 0.0,
    emissive: 0x2a1305, emissiveIntensity: 0.15 });
  var matToast = new THREE.MeshStandardMaterial({ color: 0x6a3a12, roughness: 0.9, metalness: 0.0 });
  var markMesh = new THREE.Mesh(geoOnion, matOnion);
  markMesh.visible = false;
  scene.add(markMesh);

  // sartén (pan) bajo los trozos
  var panGeo = new THREE.CylinderGeometry(1, 1, 0.2, 48);
  var panMat = new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 0.9, metalness: 0.1 });
  var pan = new THREE.Mesh(panGeo, panMat);
  pan.position.y = -0.12;
  scene.add(pan);

  // ---- InstancedMesh (una draw call para toda la rejilla) ----
  var pieces = null;
  var dummy = new THREE.Object3D();
  var spacing = 1, pieceR = 0.45, baseScaleY = 0.45, topY = 0.37;

  function layout() {
    var G = cols;
    spacing = 1;
    pieceR = spacing * 0.46;
    baseScaleY = pieceR;        // escala uniforme: disco de tortilla
    topY = 0.37 * pieceR;       // altura de la cara superior

    if (pieces) { scene.remove(pieces); pieces.geometry = pieceGeo; pieces.dispose && pieces.dispose(); }
    pieces = new THREE.InstancedMesh(pieceGeo, matPieces, G * G);
    scene.add(pieces);

    var half = (G - 1) / 2;
    for (var r = 0; r < G; r++) {
      for (var cc = 0; cc < G; cc++) {
        var idx = r * G + cc;
        dummy.position.set((cc - half) * spacing, 0, (r - half) * spacing);
        dummy.scale.set(pieceR, baseScaleY, pieceR);
        dummy.rotation.set(0, (idx % 4) * Math.PI / 2, 0);
        dummy.updateMatrix();
        pieces.setMatrixAt(idx, dummy.matrix);
      }
    }
    pieces.instanceMatrix.needsUpdate = true;

    // material según modo (interior visible / dada la vuelta)
    matPieces.map = level >= 5 ? texFlip : texNormal;
    matPieces.bumpMap = matPieces.map;
    matPieces.needsUpdate = true;

    // pan cubre la rejilla
    var boardExtent = half * spacing + pieceR;
    pan.scale.set(boardExtent + pieceR * 0.6, 1, boardExtent + pieceR * 0.6);

    // marca del objetivo
    placeMark();

    // cámara ortográfica ajustada al tablero
    var m = boardExtent + pieceR * 0.35;
    camera.left = -m; camera.right = m; camera.top = m; camera.bottom = -m;
    camera.position.set(0, 10, 2.2);   // leve inclinación
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    resizeRenderer();
  }

  function cellCenter(idx, out) {
    var G = cols, half = (G - 1) / 2;
    var cc = idx % G, r = Math.floor(idx / G);
    out.set((cc - half) * spacing, 0, (r - half) * spacing);
    return out;
  }

  var _v = new THREE.Vector3();
  function placeMark() {
    cellCenter(targetIndex, _v);
    if (level < 5) {
      // cebolla caramelizada: tira curva tumbada sobre el trozo
      var frac = [0, 0.34, 0.26, 0.21, 0.14][level] || 0.14;
      var os = pieceR * frac * 1.15;
      markMesh.geometry = geoOnion;
      markMesh.material = matOnion;
      markMesh.scale.set(os, os * 0.55, os);
      var off = (level >= 4 ? 0.30 : 0.10) * pieceR;
      markMesh.position.set(_v.x + off, topY + os * 0.12, _v.z + off);
      markMesh.rotation.set(Math.PI / 2, 0, 0.4 + (targetIndex % 5) * 0.5);
    } else {
      var shrink = Math.max(0.05, 0.22 - (level - 5) * 0.012);
      var ms = pieceR * shrink;
      markMesh.geometry = geoToast;
      markMesh.material = matToast;
      markMesh.scale.set(ms, ms * 0.3, ms);
      markMesh.position.set(_v.x + pieceR * 0.26, topY - ms * 0.1, _v.z - pieceR * 0.22);
      markMesh.rotation.set(0, 0, 0);
    }
    markMesh.visible = true;
  }

  // ---- Render loop ----
  var needsRender = true;
  function requestRender() { needsRender = true; }
  function loop() {
    requestAnimationFrame(loop);
    if (needsRender) { renderer.render(scene, camera); needsRender = false; }
  }
  loop();

  function resizeRenderer() {
    var stage = document.getElementById("stage");
    var maxW = stage.clientWidth - 4;
    var maxH = stage.clientHeight - 4;
    var side = Math.max(220, Math.min(Math.min(maxW, maxH), 640));
    var inner = side - 24; // padding del board
    renderer.setSize(inner, inner, true);
    requestRender();
  }

  // ---- Nivel ----
  function setupLevel() {
    var G = gridForLevel(level);
    cols = rows = G;
    fails = 0;
    targetIndex = Math.floor(Math.random() * G * G);
    elLevel.textContent = "Nivel " + level;
    elFails.textContent = "Fallos: 0";
    layout();
    requestRender();
  }

  // ---- Entrada: raycasting ----
  var raycaster = new THREE.Raycaster();
  var ndc = new THREE.Vector2();

  function pick(clientX, clientY) {
    var rect = renderer.domElement.getBoundingClientRect();
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return -1;
    ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    var hit = raycaster.intersectObject(pieces, false);
    if (hit.length) return hit[0].instanceId;
    return -1;
  }

  function handleHit(idx) {
    if (locked || idx < 0) return;
    if (idx === targetIndex) win();
    else fail();
  }

  function fail() {
    fails++;
    elFails.textContent = "Fallos: " + fails;
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
    app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
    miss.textContent = missFrases[Math.floor(Math.random() * missFrases.length)];
    miss.classList.remove("on"); void miss.offsetWidth; miss.classList.add("on");
  }

  function win() {
    locked = true;
    msg.textContent = msgFrases[Math.floor(Math.random() * msgFrases.length)];
    msg.classList.remove("win"); void msg.offsetWidth; msg.classList.add("win");
    ole.classList.remove("win"); void ole.offsetWidth; ole.classList.add("win");

    if (level > record) {
      record = level;
      localStorage.setItem(REC_KEY, String(record));
      elRecord.textContent = "Récord: " + record;
    }

    // zoom del trozo acertado + de la marca
    cellCenter(targetIndex, _v);
    var t = 0;
    var markBaseY = markMesh.position.y;
    function anim() {
      t += 0.06;
      var s = 1 + Math.sin(Math.min(t, 1) * Math.PI) * 0.6; // hasta 1.6
      dummy.position.set(_v.x, 0, _v.z);
      dummy.scale.set(pieceR * s, baseScaleY * s, pieceR * s);
      dummy.rotation.set(0, (targetIndex % 4) * Math.PI / 2, 0);
      dummy.updateMatrix();
      pieces.setMatrixAt(targetIndex, dummy.matrix);
      pieces.instanceMatrix.needsUpdate = true;
      markMesh.position.y = markBaseY + (s - 1) * baseScaleY * 0.6;
      requestRender();
      if (t < 1) requestAnimationFrame(anim);
    }
    anim();

    setTimeout(function () {
      board.style.opacity = "0";
      setTimeout(function () {
        level++;
        setupLevel();
        board.style.opacity = "1";
        locked = false;
      }, 300);
    }, 1000);
  }

  // ---- Eventos ----
  renderer.domElement.addEventListener("click", function (e) {
    handleHit(pick(e.clientX, e.clientY));
  });
  renderer.domElement.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    handleHit(pick(t.clientX, t.clientY));
  }, { passive: false });

  document.getElementById("reset").addEventListener("click", function () {
    if (locked) return;
    level = 1;
    setupLevel();
  });

  window.addEventListener("resize", function () { if (!locked) resizeRenderer(); });

  // ---- Arranque ----
  elRecord.textContent = "Récord: " + record;
  setupLevel();
})();
</script>
</body>
</html>
