<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Encuentra el Trozo con Cebolla</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='80'>🍳</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #ffe9c7 0%, #f6c98a 55%, #e0a35f 100%);
    color: #5a3a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: clamp(14px, 4.5vw, 20px);
    padding: 4px 6px;
  }
  header .rec { color: #a85a1a; }
  h1 {
    font-size: clamp(18px, 5.5vw, 30px);
    text-align: center;
    margin: 4px 0 2px;
    color: #7a3d0e;
    text-shadow: 1px 1px 0 #fff4;
    letter-spacing: .5px;
  }
  .sub {
    font-size: clamp(10px, 3vw, 13px);
    text-align: center;
    color: #8a5a2a;
    margin-bottom: 6px;
    font-style: italic;
  }
  #stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #board {
    background: #c98a4a;
    border-radius: 18px;
    box-shadow: 0 10px 26px #0004, inset 0 0 0 6px #b3763a, inset 0 0 0 10px #d99a55;
    padding: 12px;
    transition: opacity .28s ease;
    touch-action: manipulation;
  }
  canvas { display: block; border-radius: 8px; }
  #footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 6px 2px;
    font-weight: 600;
    font-size: clamp(13px, 4vw, 18px);
  }
  #fails { color: #b23a2a; }
  button {
    font-family: inherit;
    font-weight: 700;
    border: none;
    cursor: pointer;
    background: #d4702a;
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 3.5vw, 15px);
    box-shadow: 0 3px 0 #a8501a;
    transition: transform .08s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #a8501a; }

  /* Overlays de mensajes */
  #flash {
    position: absolute;
    inset: 0;
    background: #ff2a2a;
    opacity: 0;
    pointer-events: none;
    border-radius: 18px;
  }
  #flash.on { animation: flashRed .22s ease; }
  @keyframes flashRed { 0%{opacity:.55} 100%{opacity:0} }
  #app.shake { animation: shake .22s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-4px)}
  }
  #msg {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%) scale(.4);
    font-size: clamp(28px, 11vw, 64px);
    font-weight: 900;
    color: #1c9c3c;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 #0002;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  #msg.win { animation: pop 1s ease forwards; }
  @keyframes pop {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4)}
    20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}
    75%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.05)}
  }
  #ole {
    position: absolute;
    left: 50%; top: 22%;
    transform: translateX(-50%);
    font-size: clamp(22px, 8vw, 44px);
    font-weight: 900;
    color: #d4702a;
    text-shadow: 2px 2px 0 #fff;
    opacity: 0;
    pointer-events: none;
  }
  #ole.win { animation: ole 1s ease forwards; }
  @keyframes ole {
    0%{opacity:0; transform:translateX(-50%) translateY(10px)}
    30%{opacity:1; transform:translateX(-50%) translateY(0)}
    100%{opacity:0; transform:translateX(-50%) translateY(-20px)}
  }
  #miss {
    position: absolute;
    left: 50%; top: 40%;
    transform: translateX(-50%);
    font-size: clamp(20px, 7vw, 40px);
    font-weight: 900;
    color: #fff;
    text-shadow: 2px 2px 0 #b02020;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
  }
  #miss.on { animation: missA .8s ease forwards; }
  @keyframes missA {
    0%{opacity:0; transform:translateX(-50%) scale(.6)}
    25%{opacity:1; transform:translateX(-50%) scale(1.1)}
    80%{opacity:1}
    100%{opacity:0}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="level">Nivel 1</span>
    <span class="rec" id="record">Récord: 1</span>
  </header>
  <h1>¿Dónde está la cebolla?</h1>
  <div class="sub">La Guerra de la Tortilla · encuentra el único trozo traidor</div>
  <div id="stage">
    <div id="board"><canvas id="c"></canvas></div>
    <div id="flash"></div>
    <div id="miss"></div>
    <div id="ole">¡Olé!</div>
    <div id="msg">¡ENCONTRADA!</div>
  </div>
  <div id="footer">
    <span id="fails">Fallos: 0</span>
    <button id="reset">Empezar de nuevo</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var board = document.getElementById("board");
  var app = document.getElementById("app");
  var elLevel = document.getElementById("level");
  var elRecord = document.getElementById("record");
  var elFails = document.getElementById("fails");
  var flash = document.getElementById("flash");
  var msg = document.getElementById("msg");
  var ole = document.getElementById("ole");
  var miss = document.getElementById("miss");

  var REC_KEY = "tortillaRecord";
  var record = parseInt(localStorage.getItem(REC_KEY) || "1", 10) || 1;

  var level = 1;
  var fails = 0;
  var cols = 4, rows = 4;
  var targetIndex = 0;
  var cellPx = 0;        // tamaño de celda en px de dibujo
  var pad = 4;           // hueco entre trozos
  var boardPx = 0;       // lado del canvas (px lógicos)
  var locked = false;    // bloquea input durante transiciones

  var msgFrases = ["¡ENCONTRADA!", "¡ESA ES!", "¡CEBOLLISTA!", "¡BIEN VISTO!"];
  var missFrases = [
    "¡AY! Esa es sin cebolla",
    "¡Esa no lleva!",
    "Prueba otra vez",
    "¡Nada de cebolla ahí!",
    "Team sincebollista detectado"
  ];

  // ---- Configuración procedural del nivel ----
  function gridForLevel(l) {
    // Niveles 1-4 fijos; a partir de 5 crece de 2 en 2 hasta 30.
    var map = { 1: 4, 2: 6, 3: 8, 4: 10 };
    if (map[l]) return map[l];
    var g = 12 + (l - 5) * 2; // nivel 5 -> 12x12
    return Math.min(30, g);
  }

  function setupLevel() {
    var g = gridForLevel(level);
    cols = rows = g;
    fails = 0;
    targetIndex = Math.floor(Math.random() * cols * rows);
    elLevel.textContent = "Nivel " + level;
    elFails.textContent = "Fallos: 0";
    resize();
  }

  // ---- Dimensionado responsive ----
  function resize() {
    var stage = document.getElementById("stage");
    var maxW = board.parentElement.clientWidth - 4;
    var maxH = stage.clientHeight - 4;
    var side = Math.min(maxW, maxH);
    side = Math.max(220, Math.min(side, 640));

    var inner = side - 24; // padding del board (12 por lado)
    cellPx = inner / cols;
    pad = Math.max(1, Math.min(4, cellPx * 0.08));
    boardPx = inner;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(boardPx * dpr);
    canvas.height = Math.round(boardPx * dpr);
    canvas.style.width = boardPx + "px";
    canvas.style.height = boardPx + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildSprites(cellPx - pad);
    draw();
  }

  // PRNG determinista por celda: misma textura en cada redibujado
  function makeRng(seed) {
    var s = (seed | 0) % 233280;
    if (s < 0) s += 233280;
    return function () {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  }

  // ---- Sprites cacheados: se dibuja UN trozo y se repite (fluido en 30x30) ----
  var pieceSize = 0, spriteNormal = null, spriteTarget = null;

  function buildSprites(sizeLogical) {
    pieceSize = sizeLogical;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    spriteNormal = renderSprite(sizeLogical, dpr, false);
    spriteTarget = renderSprite(sizeLogical, dpr, true);
  }

  function renderSprite(sizeLogical, dpr, isTarget) {
    var pxl = Math.max(1, Math.ceil(sizeLogical * dpr));
    var cv = document.createElement("canvas");
    cv.width = pxl; cv.height = pxl;
    var c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (level >= 5) drawDome(c, sizeLogical, isTarget);
    else drawWedge(c, sizeLogical, isTarget);
    return cv;
  }

  // Silueta de una porción/cuña de tortilla (corteza arriba, punta abajo)
  function wedgeSil(c, s) {
    var lX = s * 0.14, rX = s * 0.86, topY = s * 0.30, crestY = s * 0.13, apexY = s * 0.92;
    c.beginPath();
    c.moveTo(lX, topY);
    c.quadraticCurveTo(s / 2, crestY, rX, topY);
    c.quadraticCurveTo(rX + s * 0.02, topY + s * 0.02, s / 2, apexY);
    c.quadraticCurveTo(lX - s * 0.02, topY + s * 0.02, lX, topY);
    c.closePath();
    return { lX: lX, rX: rX, topY: topY, crestY: crestY, apexY: apexY };
  }

  // NIVELES 1-4: porción de tortilla vista de perfil (corte con patata + huevo)
  function drawWedge(c, s, isTarget) {
    // sombra
    c.beginPath();
    c.ellipse(s / 2, s * 0.9, s * 0.30, s * 0.055, 0, 0, Math.PI * 2);
    c.fillStyle = "rgba(120,70,20,0.22)";
    c.fill();

    var g = wedgeSil(c, s);

    // relleno de huevo cuajado
    wedgeSil(c, s);
    var eg = c.createLinearGradient(0, g.topY, 0, g.apexY);
    eg.addColorStop(0, "#F4D97F");
    eg.addColorStop(1, "#E6BB50");
    c.fillStyle = eg;
    c.fill();

    // interior: capas de patata (el corte inconfundible)
    c.save();
    wedgeSil(c, s);
    c.clip();
    var pot = ["#FBEFC4", "#F7E4A6", "#FCF0CC"];
    for (var i = 0; i < 4; i++) {
      var f = 0.30 + 0.17 * i;
      var yy = g.topY + (g.apexY - g.topY) * f;
      var half = ((g.rX - g.lX) / 2) * (1 - f) * 1.25;
      var ccx = s / 2 + (i % 2 ? -1 : 1) * half * 0.18;
      c.beginPath();
      c.ellipse(ccx, yy, Math.max(2, half * 0.85), Math.max(1.5, s * 0.055), 0, 0, Math.PI * 2);
      c.fillStyle = pot[i % 3];
      c.fill();
      c.strokeStyle = "rgba(198,150,80,0.4)";
      c.lineWidth = Math.max(0.5, s * 0.008);
      c.stroke();
    }

    // cebolla caramelizada en el objetivo, incrustada en el corte
    if (isTarget) {
      var frac = [0, 0.33, 0.25, 0.20, 0.125][level] || 0.125;
      var os = s * frac;
      var ox = s / 2 + (level >= 4 ? 0.20 : 0.08) * s;
      var oy = g.topY + (g.apexY - g.topY) * (level >= 4 ? 0.62 : 0.48);
      c.save();
      c.translate(ox, oy);
      c.rotate(0.5);
      var og = c.createLinearGradient(-os, 0, os, 0);
      og.addColorStop(0, "#C9812F");
      og.addColorStop(1, level <= 2 ? "#9A5518" : "#7A3F10");
      c.beginPath();
      c.ellipse(0, 0, os * 0.6, os * 0.28, 0, 0, Math.PI * 2);
      c.fillStyle = og;
      c.fill();
      c.strokeStyle = "rgba(80,40,8,0.55)";
      c.lineWidth = Math.max(0.5, s * 0.01);
      c.stroke();
      c.restore();
    }
    c.restore();

    // corteza dorada tostada en el borde superior (banda gruesa)
    c.save();
    wedgeSil(c, s);
    c.clip();
    c.beginPath();
    c.moveTo(g.lX, g.topY);
    c.quadraticCurveTo(s / 2, g.crestY, g.rX, g.topY);
    c.quadraticCurveTo(s / 2, g.topY + s * 0.11, g.lX, g.topY);
    c.closePath();
    var cg = c.createLinearGradient(0, g.crestY, 0, g.topY + s * 0.12);
    cg.addColorStop(0, "#CC8F3E");
    cg.addColorStop(1, "#E4BA55");
    c.fillStyle = cg;
    c.fill();
    // brillo de la corteza
    c.beginPath();
    c.moveTo(g.lX + s * 0.05, g.topY - s * 0.01);
    c.quadraticCurveTo(s / 2, g.crestY + s * 0.02, g.rX - s * 0.05, g.topY - s * 0.01);
    c.strokeStyle = "rgba(255,236,185,0.5)";
    c.lineWidth = Math.max(0.5, s * 0.018);
    c.stroke();
    c.restore();

    // contorno
    wedgeSil(c, s);
    c.strokeStyle = "#A8681F";
    c.lineWidth = Math.max(1, s * 0.028);
    c.stroke();
  }

  // NIVELES 5+: tortilla "dada la vuelta", cara exterior dorada abombada
  function drawDome(c, s, isTarget) {
    var cxp = s / 2, cyp = s / 2, R = s * 0.42;
    // sombra
    c.beginPath();
    c.ellipse(cxp, cyp + s * 0.04, R * 0.98, R * 0.9, 0, 0, Math.PI * 2);
    c.fillStyle = "rgba(120,70,20,0.2)";
    c.fill();
    // cuerpo abombado
    c.beginPath();
    c.arc(cxp, cyp, R, 0, Math.PI * 2);
    var rg = c.createRadialGradient(cxp - R * 0.28, cyp - R * 0.28, R * 0.1, cxp, cyp, R);
    rg.addColorStop(0, "#EBBA63");
    rg.addColorStop(0.7, "#D2933F");
    rg.addColorStop(1, "#AE7228");
    c.fillStyle = rg;
    c.fill();
    // aro tostado
    c.lineWidth = s * 0.04;
    c.strokeStyle = "#9C6320";
    c.stroke();
    // motas de tostado
    var rng = makeRng(4321);
    c.save();
    c.beginPath(); c.arc(cxp, cyp, R, 0, Math.PI * 2); c.clip();
    c.fillStyle = "rgba(120,75,30,0.26)";
    for (var i = 0; i < 7; i++) {
      var a = rng() * 6.283, rr = rng() * R * 0.85;
      c.beginPath();
      c.arc(cxp + Math.cos(a) * rr, cyp + Math.sin(a) * rr, s * (0.015 + rng() * 0.03), 0, 6.283);
      c.fill();
    }
    // marca objetivo: burbuja tostada desplazada, menor con el nivel
    if (isTarget) {
      var shrink = Math.max(0.04, 0.20 - (level - 5) * 0.012);
      var ms = s * shrink;
      var mox = cxp + s * 0.16, moy = cyp - s * 0.14;
      var mg = c.createRadialGradient(mox, moy, ms * 0.1, mox, moy, ms);
      mg.addColorStop(0, "rgba(105,58,18,0.9)");
      mg.addColorStop(1, "rgba(105,58,18,0)");
      c.beginPath();
      c.arc(mox, moy, ms, 0, 6.283);
      c.fillStyle = mg;
      c.fill();
    }
    c.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, boardPx, boardPx);
    if (!spriteNormal) return;
    var step = boardPx / cols;
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var idx = row * cols + col;
        var x = col * step + pad / 2;
        var y = row * step + pad / 2;
        ctx.drawImage(idx === targetIndex ? spriteTarget : spriteNormal,
                      x, y, pieceSize, pieceSize);
      }
    }
  }

  // ---- Partículas al acertar ----
  function particles(px, py) {
    var parts = [];
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 1.5 + Math.random() * 3.5;
      parts.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1.5,
        life: 1,
        col: Math.random() < 0.5 ? "#ffd34d" : "#ffb02e"
      });
    }
    var frames = 0;
    function step() {
      draw();
      var alive = false;
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.life <= 0) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 0.03;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      frames++;
      if (alive && frames < 60) requestAnimationFrame(step);
      else draw();
    }
    step();
  }

  // ---- Entrada del jugador ----
  function cellAt(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var x = (clientX - rect.left) * (boardPx / rect.width);
    var y = (clientY - rect.top) * (boardPx / rect.height);
    if (x < 0 || y < 0 || x >= boardPx || y >= boardPx) return -1;
    var step = boardPx / cols;
    var col = Math.floor(x / step);
    var row = Math.floor(y / step);
    return row * cols + col;
  }

  function handleHit(idx) {
    if (locked || idx < 0) return;
    if (idx === targetIndex) win();
    else fail();
  }

  function fail() {
    fails++;
    elFails.textContent = "Fallos: " + fails;
    flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
    app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
    miss.textContent = missFrases[Math.floor(Math.random() * missFrases.length)];
    miss.classList.remove("on"); void miss.offsetWidth; miss.classList.add("on");
  }

  function win() {
    locked = true;

    // zoom del trozo acertado
    var step = boardPx / cols;
    var col = targetIndex % cols;
    var row = Math.floor(targetIndex / cols);
    var cx = col * step + step / 2;
    var cy = row * step + step / 2;

    zoomTarget(cx, cy, step, function () {
      particles(cx, cy);
    });

    msg.textContent = msgFrases[Math.floor(Math.random() * msgFrases.length)];
    msg.classList.remove("win"); void msg.offsetWidth; msg.classList.add("win");
    ole.classList.remove("win"); void ole.offsetWidth; ole.classList.add("win");

    // récord
    var reached = level;
    if (reached > record) {
      record = reached;
      localStorage.setItem(REC_KEY, String(record));
      elRecord.textContent = "Récord: " + record;
    }

    setTimeout(function () {
      board.style.opacity = "0";
      setTimeout(function () {
        level++;
        setupLevel();
        board.style.opacity = "1";
        locked = false;
      }, 300);
    }, 1000);
  }

  function zoomTarget(cx, cy, size, done) {
    var t = 0;
    function step() {
      t += 0.08;
      var s = 1 + Math.sin(Math.min(t, 1) * Math.PI) * 0.5; // hasta 1.5
      draw();
      var ps = pieceSize * s;
      ctx.drawImage(spriteTarget, cx - ps / 2, cy - ps / 2, ps, ps);
      if (t < 1) requestAnimationFrame(step);
      else if (done) done();
    }
    step();
  }

  // ---- Eventos ----
  canvas.addEventListener("click", function (e) {
    handleHit(cellAt(e.clientX, e.clientY));
  });
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    handleHit(cellAt(t.clientX, t.clientY));
  }, { passive: false });

  document.getElementById("reset").addEventListener("click", function () {
    if (locked) return;
    level = 1;
    setupLevel();
  });

  window.addEventListener("resize", function () {
    if (!locked) resize();
  });

  // ---- Arranque ----
  elRecord.textContent = "Récord: " + record;
  setupLevel();
})();
</script>
</body>
</html>
