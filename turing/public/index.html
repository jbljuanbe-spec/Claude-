<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>¿Humano o máquina?</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --me:#2b6cff; --them:#2a2e37; --txt:#e7e9ee; --dim:#8b909c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { max-width:560px; margin:0 auto; height:100%; display:flex; flex-direction:column; }
  header { padding:14px 16px; text-align:center; border-bottom:1px solid #23262f; }
  header h1 { margin:0; font-size:17px; }
  header p { margin:4px 0 0; color:var(--dim); font-size:13px; }
  .screen { flex:1; display:flex; flex-direction:column; min-height:0; }
  .center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  button { font:inherit; cursor:pointer; border:0; border-radius:12px; padding:14px 20px;
    background:var(--me); color:#fff; font-weight:600; }
  button.ghost { background:var(--them); }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:78%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .them { background:var(--them); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--me); align-self:flex-end; border-bottom-right-radius:4px; }
  .typing { color:var(--dim); font-size:13px; align-self:flex-start; padding:4px 13px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #23262f; }
  input { flex:1; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid #2a2e37;
    background:#0c0e12; color:var(--txt); }
  .actions { display:flex; gap:8px; padding:0 12px 12px; }
  .actions button { flex:1; }
  .hidden { display:none !important; }
  .dim { color:var(--dim); font-size:14px; }
  .big { font-size:22px; font-weight:700; }
  .ok { color:#3ddc84; } .bad { color:#ff5c5c; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>¿Humano o máquina?</h1>
    <p>Chatea y adivina con quién hablas.</p>
  </header>

  <!-- Inicio -->
  <section id="home" class="screen">
    <div class="center">
      <p class="dim">Te emparejamos con alguien. Puede ser una persona real u otra IA imitándola.
        Habla un rato y luego adivina.</p>
      <button id="playBtn">Entrar a la partida</button>
      <p class="dim">Aciertos: <span id="scoreHome">0</span></p>
    </div>
  </section>

  <!-- Buscando -->
  <section id="waiting" class="screen hidden">
    <div class="center">
      <div class="big">Buscando rival…</div>
      <p class="dim" id="waitMsg">conectando…</p>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat" class="screen hidden">
    <div id="log"></div>
    <div class="actions">
      <button class="ghost" data-guess="human">Creo que es HUMANO</button>
      <button class="ghost" data-guess="ai">Creo que es MÁQUINA</button>
    </div>
    <form id="chatForm">
      <input id="input" autocomplete="off" placeholder="escribe algo…" />
      <button type="submit">Enviar</button>
    </form>
  </section>

  <!-- Resultado -->
  <section id="result" class="screen hidden">
    <div class="center">
      <div class="big" id="verdict"></div>
      <p id="detail" class="dim"></p>
      <p class="dim">Aciertos: <span id="scoreEnd">0</span></p>
      <button id="againBtn">Jugar otra vez</button>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const screens = { home:$("home"), waiting:$("waiting"), chat:$("chat"), result:$("result") };
function show(name) { for (const k in screens) screens[k].classList.toggle("hidden", k !== name); }

let ws, typingEl, score = 0;

function connect() {
  const url = location.origin.replace(/^http/, "ws") + "/ws";
  ws = new WebSocket(url);
  ws.onopen = () => { $("waitMsg").textContent = "buscando rival…"; ws.send(JSON.stringify({ t:"join" })); };
  ws.onclose = () => { if (!screens.result.classList.contains("hidden")) return; $("waitMsg").textContent = "conexión perdida, reintenta"; };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
}

function handle(m) {
  switch (m.t) {
    case "status": $("waitMsg").textContent = m.text; break;
    case "start": startChat(); break;
    case "typing": showTyping(); break;
    case "msg": clearTyping(); addBubble(m.text, "them"); break;
    case "opponent_voted": /* el rival ya votó; seguimos */ break;
    case "opponent_left": clearTyping(); addSystem("tu rival se fue. vota igualmente."); break;
    case "result": showResult(m); break;
  }
}

function startChat() {
  $("log").innerHTML = "";
  $("input").value = "";
  setGuessEnabled(true);
  show("chat");
  $("input").focus();
}

function addBubble(text, cls) {
  const d = document.createElement("div");
  d.className = "bubble " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function addSystem(text) {
  const d = document.createElement("div");
  d.className = "typing";
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function showTyping() {
  clearTyping();
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.textContent = "escribiendo…";
  $("log").appendChild(typingEl);
  $("log").scrollTop = $("log").scrollHeight;
}
function clearTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function setGuessEnabled(on) {
  document.querySelectorAll("[data-guess]").forEach((b) => (b.disabled = !on));
}

document.querySelectorAll("[data-guess]").forEach((b) =>
  b.addEventListener("click", () => {
    ws.send(JSON.stringify({ t:"vote", guess:b.dataset.guess }));
    setGuessEnabled(false);
  })
);

$("chatForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  addBubble(text, "me");
  ws.send(JSON.stringify({ t:"msg", text }));
  $("input").value = "";
});

function showResult(m) {
  score = m.score;
  const wasHuman = m.truth === "human";
  $("verdict").innerHTML = m.correct
    ? '<span class="ok">¡Acertaste!</span>'
    : '<span class="bad">Fallaste</span>';
  $("detail").textContent = wasHuman
    ? "Era una persona real."
    : "Era una IA imitando a un humano.";
  $("scoreEnd").textContent = score;
  $("scoreHome").textContent = score;
  show("result");
}

$("playBtn").addEventListener("click", () => { show("waiting"); connect(); });
$("againBtn").addEventListener("click", () => {
  show("waiting");
  if (ws && ws.readyState === 1) { $("waitMsg").textContent = "buscando rival…"; ws.send(JSON.stringify({ t:"join" })); }
  else connect();
});
</script>
</body>
</html>
